<style>
*{box-sizing:border-box}
:root{
  --cream:#fffaf4; --paper:#fffdf9; --pink:#ef7f91; --pink-dark:#d8667b;
  --pink-soft:#ffe4e7; --brown:#5a3423; --brown2:#795846; --muted:#9b8578;
  --line:#eaded5; --leaf:#93a276; --shadow:0 5px 18px rgba(92,62,45,.09);
}
html,body{margin:0;min-height:100%;background:var(--cream);color:var(--brown)}
body{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;
-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
.hidden{display:none!important}
.app{max-width:760px;margin:auto;min-height:100vh;padding-bottom:96px}

.leaf-row{height:34px;display:flex;align-items:center;justify-content:center;gap:72px;pointer-events:none;overflow:visible;position:relative}
.leaf-row .leaf{display:block;width:38px;height:50px;background-image:var(--leaf-img);background-size:contain;background-repeat:no-repeat;background-position:center;opacity:.9;flex:none}
.leaf-row .leaf:nth-child(1){transform:rotate(-8deg)}
.leaf-row .leaf:nth-child(2){display:none}
.leaf-row .leaf:nth-child(3){transform:scaleX(-1) rotate(-8deg)}
.leaf-corner{position:absolute;width:36px;height:48px;background-image:var(--leaf-img);background-size:contain;background-repeat:no-repeat;background-position:center;opacity:.9;pointer-events:none}

/* HOMEのバックアップ・復元メニュー */
.settings-wrap{position:absolute;left:12px;top:12px;z-index:20}
.settings-gear{position:relative;width:46px;height:46px;border:1px solid #ead8cc;border-radius:50%;
background:#fff4e8;color:#76513e;font-size:27px;line-height:1;display:grid;place-items:center;
box-shadow:0 3px 10px rgba(91,61,44,.08)}
.settings-gear:active{transform:scale(.97)}
.gear-leaf{position:absolute;width:15px;height:20px;right:1px;bottom:0;background-image:var(--leaf-img);
background-size:contain;background-repeat:no-repeat;background-position:center;transform:rotate(22deg)}
.settings-menu{position:absolute;left:0;top:52px;width:154px;padding:7px;background:#fffaf4;
border:1px solid #ead8cc;border-radius:17px;box-shadow:0 8px 22px rgba(91,61,44,.14)}
.settings-menu button{width:100%;border:0;background:transparent;color:var(--brown);
display:flex;align-items:center;justify-content:space-between;text-align:left;padding:11px 10px;
border-radius:11px;font-size:14px}
.settings-menu button:active{background:var(--pink-soft)}
.settings-menu b{font-size:21px;font-weight:400;color:var(--pink-dark);line-height:1}

/* HOME / お気に入り */
.main-header{padding:18px 16px 11px;position:relative;background:rgba(248,239,228,.98);position:sticky;top:0;z-index:10;
backdrop-filter:blur(12px);border-bottom:1px solid rgba(234,214,202,.85)}
.main-header>.leaf-row{position:absolute;left:50%;top:39px;transform:translateX(-50%);width:220px;z-index:1}

.brand{position:relative;text-align:center;font-size:32px;font-weight:700;letter-spacing:.07em;line-height:1.25;
margin:0;color:var(--brown)}
.brand:after{content:"♥";position:absolute;right:-14px;top:-8px;color:#ef9cab;font-size:15px;transform:rotate(12deg)}
.search-row{display:flex;gap:10px;align-items:center;margin:8px 0 11px}
.search-wrap{position:relative;flex:1}
.search{width:100%;height:52px;padding:0 16px 0 48px;border:1px solid var(--line);border-radius:27px;
background:#fff;outline:none;color:var(--brown);font-size:16px;box-shadow:0 2px 10px rgba(91,61,44,.05)}
.search::placeholder{color:#a1938b}
.search-icon{position:absolute;left:16px;top:13px;width:20px;height:20px;border:2.5px solid #9b8e87;
border-radius:50%;pointer-events:none}
.search-icon:after{content:"";position:absolute;width:8px;border-top:2.5px solid #9b8e87;right:-6px;bottom:-3px;
transform:rotate(45deg);border-radius:3px}
.view-switch{display:flex;gap:6px}
.view-btn{height:44px;min-width:44px;border:1px solid #efd7d3;border-radius:14px;background:#fffaf9;
color:var(--brown2);font-size:22px;line-height:1;box-shadow:0 2px 8px rgba(91,61,44,.04)}
.view-btn.active{background:var(--pink-soft);border-color:#f1b1bd;color:var(--pink-dark)}
.categories{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:4px;padding:3px 0 4px;overflow:visible}
.cat{min-width:0;border:1px solid #efd9d5;background:#fff9f7;color:#765246;border-radius:12px;
padding:7px 1px;font-size:9.5px;line-height:1.2;white-space:nowrap;box-shadow:0 1px 4px rgba(91,61,44,.03);text-align:center}
.cat.active{background:#ef8d9c;border-color:#ef8d9c;color:#fff;font-weight:700}
main{padding:15px 16px 20px}
.list-head{display:flex;align-items:center;justify-content:space-between;margin:3px 2px 12px}
.list-title{font-size:24px;font-weight:700}
.sorts{display:flex;gap:5px}
.sort-btn{border:1px solid #eddcd5;border-radius:10px;background:#fffaf8;color:var(--brown2);padding:6px 8px;font-size:11px}
.sort-btn.active{background:var(--pink-soft);border-color:#f1b1bd;color:var(--pink-dark);font-weight:700}
.card{background:var(--paper);border:1px solid rgba(234,222,212,.8);border-radius:22px;box-shadow:var(--shadow)}
.recipe-card{display:flex;overflow:hidden;margin-bottom:12px;min-height:138px;cursor:pointer}
.recipe-photo{flex:0 0 30%;width:30%;min-width:104px;aspect-ratio:4/3;height:auto;align-self:flex-start;background:#f8e8dc;display:grid;place-items:center;
overflow:hidden;position:relative;color:var(--muted)}
.recipe-photo img{width:100%;height:100%;object-fit:cover;display:block}
.no-image{font-size:18px;color:#9a8275}
.recipe-body{flex:1;min-width:0;padding:17px 15px 14px 18px;position:relative}
.recipe-body h2{margin:0 42px 7px 0;font-size:22px;line-height:1.3;font-weight:600;color:var(--brown);word-break:break-word}
.recipe-memo{font-size:14px;line-height:1.55;color:#705b4f;display:-webkit-box;-webkit-line-clamp:2;
-webkit-box-orient:vertical;overflow:hidden;white-space:pre-wrap}
.favorite-btn{position:absolute;right:13px;top:13px;border:0;background:transparent;color:#d9a8ad;
font-size:30px;line-height:1;padding:0}
.favorite-btn.on{color:var(--pink)}
.more-dot{position:absolute;right:16px;bottom:13px;color:#aa9285;font-size:22px;letter-spacing:3px}

.home-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.home-grid-card{background:var(--paper);border:1px solid rgba(234,222,212,.8);border-radius:18px;box-shadow:var(--shadow);overflow:hidden;cursor:pointer;position:relative}
.home-grid-photo{width:100%;aspect-ratio:4/3;background:#f8e8dc;display:grid;place-items:center;overflow:hidden;color:var(--muted)}
.home-grid-photo img{width:100%;height:100%;object-fit:cover;display:block}
.home-grid-body{padding:10px 10px 11px;min-height:74px;position:relative}
.home-grid-name{font-size:18px;line-height:1.3;font-weight:700;color:var(--brown);padding-right:22px;word-break:break-word}
.home-grid-memo{font-size:12px;line-height:1.45;color:#856f63;margin-top:4px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;white-space:pre-wrap}
.home-grid-card .favorite-btn{right:7px;top:auto;bottom:7px;font-size:21px}
.home-text-list{display:flex;flex-direction:column;gap:6px}
.home-text-card{background:var(--paper);border:1px solid var(--line);border-radius:13px;padding:9px 12px;box-shadow:0 2px 7px rgba(91,61,44,.04);cursor:pointer;position:relative}
.home-text-name{font-size:16px;line-height:1.4;font-weight:650;color:var(--brown);padding-right:30px}
.home-text-card .favorite-btn{right:8px;top:7px;font-size:20px}
.home-bottom-decor{height:48px;margin:15px 3px 4px;display:flex;align-items:center;justify-content:space-between;pointer-events:none}
.home-bottom-decor:before,.home-bottom-decor:after{content:"";display:block;width:52px;height:42px;background-image:var(--leaf-img);background-size:contain;background-repeat:no-repeat;background-position:center;opacity:.7}
.home-bottom-decor:after{transform:scaleX(-1)}

.empty{padding:40px 18px;text-align:center;color:var(--muted);font-size:15px;line-height:1.8}
.compact-list{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.compact-card{min-height:58px;padding:9px 9px;background:var(--paper);border:1px solid var(--line);
border-radius:18px;box-shadow:var(--shadow);cursor:pointer;position:relative}
.compact-card .compact-name{font-size:15px;line-height:1.35;font-weight:600;padding-right:4px;word-break:break-word}
.compact-card .favorite-btn{font-size:20px;right:6px;top:5px}
.compact-card .more-dot{display:none}

/* 詳細 */
.sub-page{padding:13px 16px 28px;position:relative}
.page-top{display:flex;align-items:center;justify-content:center;position:relative;margin-bottom:9px}
.sub-page>.leaf-row{position:absolute;left:50%;transform:translateX(-50%);top:10px;z-index:0;width:230px}
.sub-page>.page-top{z-index:1}
.page-title{font-size:25px;font-weight:600;color:var(--brown);margin:0}
.back-btn{position:absolute;left:0;border:0;background:transparent;color:#8b685a;font-size:15px;padding:7px 3px}
.detail-card{padding:20px}
.detail-top{display:grid;grid-template-columns:40% 60%;gap:18px;align-items:start}
.detail-photo{width:100%;aspect-ratio:4/3;border-radius:17px;overflow:hidden;background:#f8e8dc;
display:grid;place-items:center}
.detail-photo img{width:100%;height:100%;object-fit:cover}
.detail-info{padding:4px 3px;min-width:0}
.detail-name{font-size:26px;line-height:1.35;font-weight:700;margin:0 0 11px;word-break:break-word}
.detail-meta{font-size:14px;color:var(--muted);line-height:1.65;margin-bottom:4px}
.detail-heart{border:0;background:transparent;color:#d9a8ad;font-size:32px;line-height:1;padding:5px 0}
.detail-heart.on{color:var(--pink)}
.detail-section{border:1px solid var(--line);border-radius:17px;background:#fff;padding:15px 16px;margin-top:13px}
.detail-section h3{margin:0 0 8px;color:var(--pink-dark);font-size:18px}
.detail-text{font-size:15px;line-height:1.8;white-space:pre-wrap;word-break:break-word;min-height:1.8em}
.ingredients-columns{column-count:2;column-gap:24px;column-fill:auto;white-space:normal}
.ingredients-columns > div{break-inside:avoid;margin-bottom:2px}
.detail-edit{width:100%;margin-top:16px;border:0;border-radius:16px;background:var(--pink);color:#fff;
font-size:17px;font-weight:700;padding:14px;box-shadow:0 4px 10px rgba(239,127,145,.22)}

/* 登録・編集 */
.form-page{padding:10px 16px 25px;position:relative}
.form-page>.leaf-row{height:38px;margin-bottom:2px}
.form-card{position:relative;padding:18px 16px 20px;overflow:hidden}
.form-heading{text-align:center;font-size:25px;font-weight:600;color:var(--brown);margin:0 0 16px}
.form-heading-wrap{display:flex;align-items:center;justify-content:center;gap:13px;position:relative;margin-bottom:16px}
.form-heading-wrap .leaf-corner{position:static;width:30px;height:40px;flex:none}
.form-heading-wrap .left-leaf{transform:rotate(-8deg)}
.form-heading-wrap .right-leaf{transform:scaleX(-1) rotate(-8deg)}
.form-heading{margin:0}
.field-label{display:flex;align-items:center;gap:7px;font-size:17px;font-weight:700;margin:15px 2px 7px}
.field-label:first-of-type{margin-top:0}
.req{font-size:11px;background:var(--pink);color:#fff;border-radius:9px;padding:3px 7px;font-weight:600}
.text-input,.text-area{width:100%;border:1px solid var(--line);border-radius:15px;background:#fff;
padding:13px 14px;color:var(--brown);font-size:16px;outline:none}
.text-area{min-height:112px;resize:vertical;line-height:1.65}
.photo-field{display:flex;gap:12px;align-items:center}
.photo-preview{width:120px;aspect-ratio:4/3;flex:none;border-radius:15px;background:#f8e8dc;border:1px solid var(--line);
display:grid;place-items:center;overflow:hidden}
.photo-preview img{width:100%;height:100%;object-fit:cover}
.photo-actions{display:flex;flex-direction:column;gap:8px}
.photo-btn{border:1px solid var(--line);background:#fff;border-radius:13px;padding:10px 13px;color:#6d4f3d;
font-size:14px;text-align:center}
.category-select{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.category-option{padding:11px 7px;border:1px solid var(--line);border-radius:14px;background:#fff;color:#6d4f3d;
font-size:14px}
.category-option.selected{background:var(--pink-soft);border-color:#efaaa3;color:var(--pink-dark);font-weight:700}
.favorite-edit{display:flex;align-items:center;justify-content:space-between;border-top:1px dashed #edcfc4;
margin-top:15px;padding-top:13px}
.favorite-edit span{font-size:16px;font-weight:700}
.favorite-toggle{border:1px solid var(--line);background:#fff;border-radius:14px;padding:8px 14px;color:var(--pink-dark);
font-size:15px}
.form-actions{display:flex;gap:9px;margin-top:19px}
.action{flex:1;border:0;border-radius:15px;padding:14px 8px;font-size:16px;font-weight:700}
.cancel{background:#eee5df;color:#66534a}
.save{background:var(--pink);color:#fff}
.delete{background:#f5dddd;color:#8a4b4b;border:1px solid #efcaca}

/* 下部ナビ */
.bottom-nav{position:fixed;z-index:30;left:50%;transform:translateX(-50%);bottom:10px;width:min(calc(100% - 20px),740px);height:64px;
background:transparent;border:0;box-shadow:none;display:grid;grid-template-columns:repeat(3,1fr);gap:9px;padding:0}
.nav-item{border:1px solid #edd7d2;background:#fffaf8;color:#8b6c61;font-size:14px;display:flex;flex-direction:column;
align-items:center;justify-content:center;gap:2px;border-radius:22px;box-shadow:0 4px 12px rgba(91,61,44,.08)}
.nav-item.active{color:#fff;background:#ef8d9c;border-color:#ef8d9c;font-weight:700}
.nav-icon{height:25px;display:grid;place-items:center;font-size:25px;line-height:1}
@media(max-width:430px){
  .brand-wrap{min-height:72px;padding:4px 42px}
  .brand{font-size:27px}
  .brand-leaf-left{width:66px;height:66px;margin-right:7px}
  .brand-leaf-right{width:66px;height:54px;margin-left:6px}
  .recipe-photo{min-width:94px;flex-basis:30%}
  .recipe-body h2{font-size:20px}
  .home-grid{gap:8px}
  .home-grid-body{padding:8px 8px 9px;min-height:70px}
  .home-grid-name{font-size:16px}
  .home-grid-memo{font-size:11px}
  .home-grid-card .favorite-btn{font-size:19px}
  .home-text-name{font-size:15px}
  .compact-list{gap:7px}
  .compact-card{min-height:56px;padding:8px 7px}
  .compact-card .compact-name{font-size:14px}
  .detail-name{font-size:22px}
  .detail-top{gap:12px}
  .form-page,.sub-page,main{padding-left:12px;padding-right:12px}
  .main-header{padding-left:10px;padding-right:10px}
  .bottom-nav{width:calc(100% - 16px);gap:6px;bottom:8px}
  .nav-item{font-size:13px;border-radius:20px}
}
</style>
</head>
<body>
<div class="app">

<!-- HOME -->
<section id="homePage" class="page">
  <header class="main-header">
    <div class="settings-wrap">
      <button id="settingsGear" class="settings-gear" type="button" aria-label="バックアップ・復元メニュー">⚙︎<span class="gear-leaf"></span></button>
      <div id="settingsMenu" class="settings-menu hidden">
        <button id="backupBtn" type="button"><span>バックアップ</span><b>›</b></button>
        <button id="restoreBtn" type="button"><span>復元</span><b>›</b></button>
        <input id="restoreInput" type="file" accept=".json,application/json" hidden>
      </div>
    </div>
    <div class="brand-wrap"><span class="brand-leaf brand-leaf-left"></span><h1 class="brand">マイレシピブック</h1><span class="brand-leaf brand-leaf-right"></span></div>
    <div class="search-row">
      <div class="search-wrap">
        <span class="search-icon"></span>
        <input id="homeSearch" class="search" type="search" placeholder="料理名を検索">
      </div>
      <div class="view-switch">
        <button id="homeListBtn" class="view-btn active" type="button" aria-label="リスト表示">▦</button>
        <button id="homeCompactBtn" class="view-btn" type="button" aria-label="たくさん表示">☰</button>
      </div>
    </div>
    <div id="homeCategories" class="categories"></div>
  </header>
  <main>
    <div class="list-head">
      <div id="homeListTitle" class="list-title">レシピ一覧</div>
      <div class="sorts">
        <button id="homeNameSort" class="sort-btn" type="button">名前順</button>
        <button id="homeDateSort" class="sort-btn active" type="button">登録順</button>
      </div>
    </div>
    <div id="homeList"></div>
    <div id="homeCompact" class="compact-list hidden"></div>
    <div class="home-bottom-decor" aria-hidden="true"></div>
  </main>
</section>

<!-- お気に入り -->
<section id="favoritesPage" class="page hidden">
  <header class="main-header">
    <div class="brand-wrap"><span class="brand-leaf brand-leaf-left"></span><h1 class="brand">お気に入り</h1><span class="brand-leaf brand-leaf-right"></span></div>
    <div class="search-row">
      <div class="search-wrap">
        <span class="search-icon"></span>
        <input id="favSearch" class="search" type="search" placeholder="料理名を検索">
      </div>
      <div class="view-switch">
        <button id="favListBtn" class="view-btn active" type="button">☰</button>
        <button id="favCompactBtn" class="view-btn" type="button">▦</button>
      </div>
    </div>
  </header>
  <main>
    <div class="list-head">
      <div id="favListTitle" class="list-title">お気に入り</div>
      <div class="sorts">
        <button id="favNameSort" class="sort-btn" type="button">名前順</button>
        <button id="favDateSort" class="sort-btn active" type="button">登録順</button>
      </div>
    </div>
    <div id="favList"></div>
    <div id="favCompact" class="compact-list hidden"></div>
  </main>
</section>

<!-- 登録・編集 -->
<section id="formPage" class="page hidden">
  <div class="form-page">
    <div class="form-card card">
      <div class="form-heading-wrap">
        <span class="leaf-corner left-leaf"></span>
        <h2 id="formTitle" class="form-heading">料理を追加</h2>
        <span class="leaf-corner right-leaf"></span>
      </div>

      <label class="field-label">料理名 <span class="req">必須</span></label>
      <input id="nameInput" class="text-input" maxlength="100" placeholder="料理名を入力してください">

      <label class="field-label">写真登録</label>
      <div class="photo-field">
        <div id="photoPreview" class="photo-preview"><span class="no-image">no image</span></div>
        <div class="photo-actions">
          <label class="photo-btn">写真を選ぶ
            <input id="photoInput" type="file" accept="image/*" hidden>
          </label>
          <button id="removePhoto" class="photo-btn hidden" type="button">写真を削除</button>
        </div>
      </div>

      <label class="field-label">カテゴリー</label>
      <div id="categorySelect" class="category-select"></div>

      <label class="field-label">材料</label>
      <textarea id="ingredientsInput" class="text-area" placeholder="材料を入力してください"></textarea>

      <label class="field-label">作り方</label>
      <textarea id="stepsInput" class="text-area" placeholder="作り方を入力してください"></textarea>

      <label class="field-label">メモ</label>
      <textarea id="memoInput" class="text-area" placeholder="メモを入力してください（任意）"></textarea>

      <div id="favoriteEdit" class="favorite-edit hidden">
        <span>お気に入り</span>
        <button id="favoriteToggle" class="favorite-toggle" type="button">♡ OFF</button>
      </div>

      <div class="form-actions">
        <button id="cancelForm" class="action cancel" type="button">キャンセル</button>
        <button id="deleteForm" class="action delete hidden" type="button">削除</button>
        <button id="saveForm" class="action save" type="button">保存する</button>
      </div>
    </div>
  </div>
</section>

<!-- 詳細 -->
<section id="detailPage" class="page hidden">
  <div class="sub-page">
    <div class="leaf-row" aria-hidden="true"><span class="leaf"></span><span class="leaf"></span><span class="leaf"></span></div>
    <div class="page-top">
      <button id="detailBack" class="back-btn" type="button">‹ 戻る</button>
      <h2 class="page-title">レシピ</h2>
    </div>
    <div class="detail-card card">
      <div class="detail-top">
        <div id="detailPhoto" class="detail-photo"></div>
        <div class="detail-info">
          <h2 id="detailName" class="detail-name"></h2>
          <div id="detailCategory" class="detail-meta"></div>
          <div id="detailDate" class="detail-meta"></div>
          <button id="detailHeart" class="detail-heart" type="button" aria-label="お気に入り">♡</button>
        </div>
      </div>
      <section class="detail-section">
        <h3>材料</h3>
        <div id="detailIngredients" class="detail-text ingredients-columns"></div>
      </section>
      <section class="detail-section">
        <h3>作り方</h3>
        <div id="detailSteps" class="detail-text"></div>
      </section>
      <section class="detail-section">
        <h3>メモ</h3>
        <div id="detailMemo" class="detail-text"></div>
      </section>
      <button id="detailEdit" class="detail-edit" type="button">編集する</button>
    </div>
  </div>
</section>

<nav id="bottomNav" class="bottom-nav">
  <button class="nav-item active" data-nav="home" type="button">
    <span class="nav-icon">⌂</span><span>HOME</span>
  </button>
  <button class="nav-item" data-nav="favorites" type="button">
    <span class="nav-icon">♡</span><span>お気に入り</span>
  </button>
  <button class="nav-item" data-nav="new" type="button">
    <span class="nav-icon">＋</span><span>新規登録</span>
  </button>
</nav>

<script>
(() => {
  "use strict";

  const STORAGE_KEY = "myrecipe_book_v1";
  const CATEGORIES = ["すべて","牛肉","豚肉","鶏肉","ひき肉","魚介類","ごはん&麺","スープ"];

  let recipes = [];
  let currentCategory = "すべて";
  let homeSort = "date";
  let homeView = "list";
  let favSort = "date";
  let favView = "list";
  let editingId = null;
  let detailId = null;
  let tempPhoto = "";
  let tempFavorite = false;
  let returnPage = "home";

  const $ = id => document.getElementById(id);

  function newId(){
    if(window.crypto && typeof crypto.randomUUID === "function") return crypto.randomUUID();
    return "r_" + Date.now().toString(36) + "_" + Math.random().toString(36).slice(2);
  }

  function loadRecipes(){
    try{
      const raw = localStorage.getItem(STORAGE_KEY);
      const parsed = raw ? JSON.parse(raw) : [];
      recipes = Array.isArray(parsed) ? parsed : [];
    }catch(e){
      recipes = [];
    }
    recipes = recipes.map(r => ({
      id: r.id || newId(),
      name: r.name || "",
      photo: r.photo || "",
      category: r.category || "",
      ingredients: r.ingredients || "",
      steps: r.steps || "",
      memo: r.memo || "",
      favorite: !!r.favorite,
      createdAt: r.createdAt || new Date().toISOString()
    }));
  }

  function saveRecipes(){
    try{
      localStorage.setItem(STORAGE_KEY, JSON.stringify(recipes));
      return true;
    }catch(e){
      alert("保存できませんでした。写真を一度削除して保存できるかお試しください。");
      return false;
    }
  }

  function closeSettingsMenu(){
    $("settingsMenu").classList.add("hidden");
  }

  function toggleSettingsMenu(){
    $("settingsMenu").classList.toggle("hidden");
  }

  function backupRecipes(){
    loadRecipes();
    const payload = {
      app: "マイレシピブック",
      version: 1,
      exportedAt: new Date().toISOString(),
      recipes
    };
    const blob = new Blob([JSON.stringify(payload, null, 2)], {type:"application/json"});
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = "myrecipe_book_backup.json";
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
    closeSettingsMenu();
  }

  function restoreRecipesFromFile(file){
    if(!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try{
        const data = JSON.parse(reader.result);
        const imported = Array.isArray(data) ? data : data.recipes;
        if(!Array.isArray(imported)) throw new Error("invalid");

        const cleaned = imported.map(r => ({
          id: r.id || newId(),
          name: String(r.name || "").trim(),
          photo: r.photo || "",
          category: r.category || "",
          ingredients: r.ingredients || "",
          steps: r.steps || "",
          memo: r.memo || "",
          favorite: !!r.favorite,
          createdAt: r.createdAt || new Date().toISOString()
        })).filter(r => r.name);

        const names = new Set();
        if(cleaned.some(r => names.has(r.name) ? true : (names.add(r.name), false))){
          throw new Error("duplicate");
        }

        if(!confirm("バックアップからレシピを復元します。現在のレシピは置き換えられます。よろしいですか？")) return;

        recipes = cleaned;
        if(!saveRecipes()) return;
        loadRecipes();
        closeSettingsMenu();
        goHome();
        alert("レシピを復元しました。");
      }catch(e){
        alert("バックアップファイルを読み込めませんでした。");
      }
    };
    reader.onerror = () => alert("バックアップファイルを読み込めませんでした。");
    reader.readAsText(file);
  }

  function escapeHtml(value){
    return String(value ?? "").replace(/[&<>"']/g, ch => ({
      "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"
    }[ch]));
  }

  function formatDate(iso){
    const d = new Date(iso);
    if(Number.isNaN(d.getTime())) return "";
    return `${d.getFullYear()}/${String(d.getMonth()+1).padStart(2,"0")}/${String(d.getDate()).padStart(2,"0")}`;
  }

  function showOnly(pageId){
    document.querySelectorAll(".page").forEach(p => p.classList.add("hidden"));
    $(pageId).classList.remove("hidden");
    $("bottomNav").style.display = (pageId === "homePage" || pageId === "favoritesPage") ? "grid" : "none";
  }

  function setNav(active){
    document.querySelectorAll(".nav-item").forEach(b => b.classList.toggle("active", b.dataset.nav === active));
  }

  function renderCategoryButtons(){
    $("homeCategories").innerHTML = CATEGORIES.map(c =>
      `<button class="cat ${c === currentCategory ? "active":""}" data-category="${escapeHtml(c)}" type="button">${escapeHtml(c)}</button>`
    ).join("");
  }

  function getFiltered(list, search, category){
    const q = String(search || "").trim().toLocaleLowerCase();
    return list.filter(r =>
      (!q || String(r.name).toLocaleLowerCase().includes(q)) &&
      (!category || category === "すべて" || r.category === category)
    );
  }

  function sortRecipes(list, sort){
    return [...list].sort((a,b) => {
      if(sort === "name") return String(a.name).localeCompare(String(b.name), "ja");
      return new Date(b.createdAt).getTime() - new Date(a.createdAt).getTime();
    });
  }

  function photoHtml(r, detail=false){
    if(r.photo) return `<img src="${r.photo}" alt="">`;
    return `<span class="no-image">no image</span>`;
  }

  function listCardHtml(r){
    return `
      <article class="recipe-card card" data-recipe-id="${escapeHtml(r.id)}">
        <div class="recipe-photo">${photoHtml(r)}</div>
        <div class="recipe-body">
          <button class="favorite-btn ${r.favorite ? "on":""}" data-favorite-id="${escapeHtml(r.id)}" type="button">${r.favorite ? "♥":"♡"}</button>
          <h2>${escapeHtml(r.name)}</h2>
          ${r.memo ? `<div class="recipe-memo">${escapeHtml(r.memo)}</div>` : ""}
          <div class="more-dot">•••</div>
        </div>
      </article>`;
  }

  function compactCardHtml(r){
    return `
      <article class="compact-card" data-recipe-id="${escapeHtml(r.id)}">
        <button class="favorite-btn ${r.favorite ? "on":""}" data-favorite-id="${escapeHtml(r.id)}" type="button">${r.favorite ? "♥":"♡"}</button>
        <div class="compact-name">${escapeHtml(r.name)}</div>
      </article>`;
  }

  function homeGridCardHtml(r){
    return `
      <article class="home-grid-card" data-recipe-id="${escapeHtml(r.id)}">
        <div class="home-grid-photo">${photoHtml(r)}</div>
        <div class="home-grid-body">
          <button class="favorite-btn ${r.favorite ? "on":""}" data-favorite-id="${escapeHtml(r.id)}" type="button">${r.favorite ? "♥":"♡"}</button>
          <div class="home-grid-name">${escapeHtml(r.name)}</div>
          ${r.memo ? `<div class="home-grid-memo">${escapeHtml(r.memo)}</div>` : ""}
        </div>
      </article>`;
  }

  function homeTextCardHtml(r){
    return `
      <article class="home-text-card" data-recipe-id="${escapeHtml(r.id)}">
        <button class="favorite-btn ${r.favorite ? "on":""}" data-favorite-id="${escapeHtml(r.id)}" type="button">${r.favorite ? "♥":"♡"}</button>
        <div class="home-text-name">${escapeHtml(r.name)}</div>
      </article>`;
  }

  function renderHome(){
    loadRecipes();
    renderCategoryButtons();
    let list = getFiltered(recipes, $("homeSearch").value, currentCategory);
    list = sortRecipes(list, homeSort);
    $("homeListTitle").textContent = `レシピ一覧（${list.length}）`;

    if(homeView === "list"){
      $("homeList").classList.remove("hidden");
      $("homeCompact").classList.add("hidden");
      $("homeList").className = "home-grid";
      $("homeList").innerHTML = list.length ? list.map(homeGridCardHtml).join("") :
        `<div class="empty">まだレシピがありません。<br>下の「新規登録」から追加できます。</div>`;
    }else{
      $("homeList").classList.add("hidden");
      $("homeCompact").classList.remove("hidden");
      $("homeCompact").className = "home-text-list";
      $("homeCompact").innerHTML = list.length ? list.map(homeTextCardHtml).join("") :
        `<div class="empty">まだレシピがありません。</div>`;
    }
  }

  function renderFavorites(){
    loadRecipes();
    let list = recipes.filter(r => r.favorite);
    const q = $("favSearch").value.trim().toLocaleLowerCase();
    if(q) list = list.filter(r => String(r.name).toLocaleLowerCase().includes(q));
    list = sortRecipes(list, favSort);
    $("favListTitle").textContent = `お気に入り（${list.length}）`;

    if(favView === "list"){
      $("favList").classList.remove("hidden");
      $("favCompact").classList.add("hidden");
      $("favList").innerHTML = list.length ? list.map(listCardHtml).join("") :
        `<div class="empty">お気に入り登録したレシピはありません。<br>レシピの♡から追加できます。</div>`;
    }else{
      $("favList").classList.add("hidden");
      $("favCompact").classList.remove("hidden");
      $("favCompact").innerHTML = list.length ? list.map(compactCardHtml).join("") :
        `<div class="empty">お気に入り登録したレシピはありません。</div>`;
    }
  }

  function goHome(){
    loadRecipes();
    currentCategory = "すべて";
    homeSort = "date";
    $("homeSearch").value = "";
    $("homeNameSort").classList.remove("active");
    $("homeDateSort").classList.add("active");
    showOnly("homePage");
    setNav("home");
    renderHome();
  }

  function goFavorites(){
    loadRecipes();
    $("favSearch").value = "";
    favSort = "date";
    $("favNameSort").classList.remove("active");
    $("favDateSort").classList.add("active");
    showOnly("favoritesPage");
    setNav("favorites");
    renderFavorites();
  }

  function openNewForm(){
    loadRecipes();
    editingId = null;
    tempPhoto = "";
    tempFavorite = false;
    returnPage = "home";
    $("formTitle").textContent = "料理を追加";
    $("nameInput").value = "";
    $("ingredientsInput").value = "";
    $("stepsInput").value = "";
    $("memoInput").value = "";
    renderCategorySelect("");
    updatePhotoPreview();
    $("favoriteEdit").classList.add("hidden");
    $("deleteForm").classList.add("hidden");
    showOnly("formPage");
  }

  function openEditForm(id){
    loadRecipes();
    const r = recipes.find(x => x.id === id);
    if(!r) return;
    editingId = id;
    tempPhoto = r.photo || "";
    tempFavorite = !!r.favorite;
    returnPage = "detail";
    $("formTitle").textContent = "料理を編集";
    $("nameInput").value = r.name;
    $("ingredientsInput").value = r.ingredients;
    $("stepsInput").value = r.steps;
    $("memoInput").value = r.memo;
    renderCategorySelect(r.category || "");
    updatePhotoPreview();
    $("favoriteEdit").classList.remove("hidden");
    updateFavoriteToggle();
    $("deleteForm").classList.remove("hidden");
    showOnly("formPage");
  }

  function renderCategorySelect(selected){
    $("categorySelect").innerHTML = CATEGORIES.slice(1).map(c =>
      `<button class="category-option ${selected === c ? "selected":""}" data-form-category="${escapeHtml(c)}" type="button">${escapeHtml(c)}</button>`
    ).join("");
    $("categorySelect").dataset.value = selected || "";
  }

  function updatePhotoPreview(){
    $("photoPreview").innerHTML = tempPhoto ? `<img src="${tempPhoto}" alt="">` : `<span class="no-image">no image</span>`;
    $("removePhoto").classList.toggle("hidden", !tempPhoto);
  }

  function updateFavoriteToggle(){
    $("favoriteToggle").textContent = tempFavorite ? "♥ ON" : "♡ OFF";
    $("favoriteToggle").style.color = tempFavorite ? "var(--pink)" : "var(--pink-dark)";
  }

  function saveForm(){
    loadRecipes();
    const name = $("nameInput").value.trim();
    if(!name){
      alert("料理名を入力してください。");
      return;
    }
    const duplicate = recipes.some(r => r.id !== editingId && String(r.name).trim() === name);
    if(duplicate){
      alert("「" + name + "」はもう登録されています。");
      return;
    }

    if(editingId){
      const index = recipes.findIndex(r => r.id === editingId);
      if(index < 0){ goHome(); return; }
      recipes[index] = {
        ...recipes[index],
        name,
        photo: tempPhoto,
        category: $("categorySelect").dataset.value || "",
        ingredients: $("ingredientsInput").value,
        steps: $("stepsInput").value,
        memo: $("memoInput").value,
        favorite: tempFavorite
      };
    }else{
      recipes.push({
        id: newId(),
        name,
        photo: tempPhoto,
        category: $("categorySelect").dataset.value || "",
        ingredients: $("ingredientsInput").value,
        steps: $("stepsInput").value,
        memo: $("memoInput").value,
        favorite: false,
        createdAt: new Date().toISOString()
      });
    }

    if(!saveRecipes()) return;

    // 保存直後にストレージから最新データを読み直してHOMEへ戻る
    loadRecipes();
    currentCategory = "すべて";
    homeSort = "date";
    homeView = "list";
    $("homeSearch").value = "";
    $("homeNameSort").classList.remove("active");
    $("homeDateSort").classList.add("active");
    showOnly("homePage");
    setNav("home");
    renderHome();
  }

  function deleteFormRecipe(){
    if(!editingId) return;
    loadRecipes();
    const r = recipes.find(x => x.id === editingId);
    if(!r) return;
    if(!confirm(`「${r.name}」を削除しますか？`)) return;
    recipes = recipes.filter(x => x.id !== editingId);
    saveRecipes();
    goHome();
  }

  function openDetail(id){
    loadRecipes();
    const r = recipes.find(x => x.id === id);
    if(!r) return;
    detailId = id;
    $("detailPhoto").innerHTML = photoHtml(r, true);
    $("detailName").textContent = r.name;
    $("detailCategory").textContent = r.category ? `カテゴリー：${r.category}` : "";
    $("detailDate").textContent = r.createdAt ? `登録日：${formatDate(r.createdAt)}` : "";
    $("detailIngredients").innerHTML = (r.ingredients || "").split(/\n/).filter(x => x.trim()).map(x => `<div>${escapeHtml(x)}</div>`).join("");
    $("detailSteps").textContent = r.steps || "";
    $("detailMemo").textContent = r.memo || "";
    updateDetailHeart(r.favorite);
    showOnly("detailPage");
  }

  function updateDetailHeart(on){
    $("detailHeart").textContent = on ? "♥" : "♡";
    $("detailHeart").classList.toggle("on", !!on);
  }

  function toggleFavorite(id){
    loadRecipes();
    const r = recipes.find(x => x.id === id);
    if(!r) return;
    r.favorite = !r.favorite;
    saveRecipes();

    if($("detailPage").classList.contains("hidden") === false){
      openDetail(id);
    }else if($("favoritesPage").classList.contains("hidden") === false){
      renderFavorites();
    }else{
      renderHome();
    }
  }

  // カテゴリー
  $("homeCategories").addEventListener("click", e => {
    const b = e.target.closest("[data-category]");
    if(!b) return;
    currentCategory = b.dataset.category;
    renderHome();
  });

  $("categorySelect").addEventListener("click", e => {
    const b = e.target.closest("[data-form-category]");
    if(!b) return;
    $("categorySelect").dataset.value = b.dataset.formCategory;
    document.querySelectorAll("[data-form-category]").forEach(x =>
      x.classList.toggle("selected", x === b)
    );
  });

  // 一覧カード
  document.addEventListener("click", e => {
    const fav = e.target.closest("[data-favorite-id]");
    if(fav){
      e.stopPropagation();
      toggleFavorite(fav.dataset.favoriteId);
      return;
    }
    const card = e.target.closest("[data-recipe-id]");
    if(card) openDetail(card.dataset.recipeId);
  });

  // HOME
  $("homeSearch").addEventListener("input", renderHome);
  $("homeListBtn").onclick = () => {
    homeView = "list";
    $("homeListBtn").classList.add("active");
    $("homeCompactBtn").classList.remove("active");
    renderHome();
  };
  $("homeCompactBtn").onclick = () => {
    homeView = "compact";
    $("homeCompactBtn").classList.add("active");
    $("homeListBtn").classList.remove("active");
    renderHome();
  };
  $("homeNameSort").onclick = () => {
    homeSort = "name";
    $("homeNameSort").classList.add("active");
    $("homeDateSort").classList.remove("active");
    renderHome();
  };
  $("homeDateSort").onclick = () => {
    homeSort = "date";
    $("homeDateSort").classList.add("active");
    $("homeNameSort").classList.remove("active");
    renderHome();
  };

  // お気に入り
  $("favSearch").addEventListener("input", renderFavorites);
  $("favListBtn").onclick = () => {
    favView = "list";
    $("favListBtn").classList.add("active");
    $("favCompactBtn").classList.remove("active");
    renderFavorites();
  };
  $("favCompactBtn").onclick = () => {
    favView = "compact";
    $("favCompactBtn").classList.add("active");
    $("favListBtn").classList.remove("active");
    renderFavorites();
  };
  $("favNameSort").onclick = () => {
    favSort = "name";
    $("favNameSort").classList.add("active");
    $("favDateSort").classList.remove("active");
    renderFavorites();
  };
  $("favDateSort").onclick = () => {
    favSort = "date";
    $("favDateSort").classList.add("active");
    $("favNameSort").classList.remove("active");
    renderFavorites();
  };

  // フォーム
  // 写真はそのまま保存せず、端末内保存用に自動で縮小・圧縮します。
  // iPhoneで撮った大きな写真でもlocalStorageの容量制限にかかりにくくします。
  $("photoInput").addEventListener("change", e => {
    const file = e.target.files && e.target.files[0];
    if(!file) return;
    if(!file.type.startsWith("image/")){
      alert("画像ファイルを選んでください。");
      return;
    }

    const reader = new FileReader();
    reader.onload = () => {
      const img = new Image();
      img.onload = () => {
        const MAX_SIZE = 1200;
        const scale = Math.min(1, MAX_SIZE / Math.max(img.naturalWidth, img.naturalHeight));
        const w = Math.max(1, Math.round(img.naturalWidth * scale));
        const h = Math.max(1, Math.round(img.naturalHeight * scale));
        const canvas = document.createElement("canvas");
        canvas.width = w;
        canvas.height = h;
        const ctx = canvas.getContext("2d", {alpha:false});
        ctx.drawImage(img, 0, 0, w, h);
        // JPEG化して容量を大幅に小さくする
        tempPhoto = canvas.toDataURL("image/jpeg", 0.72);
        updatePhotoPreview();
      };
      img.onerror = () => alert("写真を読み込めませんでした。別の写真をお試しください。");
      img.src = reader.result;
    };
    reader.onerror = () => alert("写真を読み込めませんでした。もう一度お試しください。");
    reader.readAsDataURL(file);
  });

  $("removePhoto").onclick = () => {
    tempPhoto = "";
    $("photoInput").value = "";
    updatePhotoPreview();
  };

  $("favoriteToggle").onclick = () => {
    tempFavorite = !tempFavorite;
    updateFavoriteToggle();
  };

  $("saveForm").addEventListener("click", saveForm);
  $("deleteForm").addEventListener("click", deleteFormRecipe);

  $("cancelForm").onclick = () => {
    if(returnPage === "detail" && editingId) openDetail(editingId);
    else goHome();
  };

  $("detailEdit").onclick = () => {
    if(detailId) openEditForm(detailId);
  };

  $("detailHeart").onclick = () => {
    if(detailId) toggleFavorite(detailId);
  };

  $("detailBack").onclick = () => goHome();

  // 下部ナビ：HOMEは必ず最新保存データを読み直す
  document.querySelectorAll(".nav-item").forEach(btn => {
    btn.addEventListener("click", () => {
      if(btn.dataset.nav === "home") goHome();
      else if(btn.dataset.nav === "favorites") goFavorites();
      else if(btn.dataset.nav === "new") openNewForm();
    });
  });

  // 歯車メニュー
  $("settingsGear").addEventListener("click", e => {
    e.stopPropagation();
    toggleSettingsMenu();
  });

  $("backupBtn").addEventListener("click", e => {
    e.stopPropagation();
    backupRecipes();
  });

  $("restoreBtn").addEventListener("click", e => {
    e.stopPropagation();
    $("restoreInput").click();
  });

  $("restoreInput").addEventListener("change", e => {
    restoreRecipesFromFile(e.target.files && e.target.files[0]);
    e.target.value = "";
  });

  document.addEventListener("click", e => {
    if(!e.target.closest(".settings-wrap")) closeSettingsMenu();
  });

  // 初期表示
  loadRecipes();
  renderCategoryButtons();
  renderHome();
})();
</script>
</body>
</html>
