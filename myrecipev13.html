<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="apple-touch-icon" href="AC737842-8EE5-4B79-9C93-C0E21E0E39C7.png">
<title>マイレシピ帳</title>
<style>
*{box-sizing:border-box}
:root{--cream:#fffaf4;--paper:#fffdf9;--pink:#f58b8b;--pink2:#ffe1dc;--brown:#4b2b1c;--muted:#8b7569;--line:#eaded4;--shadow:0 5px 18px rgba(92,62,45,.09)}
html,body{min-height:100%;background:var(--cream)}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;color:var(--brown);-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
header{position:sticky;top:0;z-index:10;background:rgba(255,250,244,.96);backdrop-filter:blur(14px);padding:10px 16px 10px;border-bottom:1px solid rgba(234,222,212,.8)}
.header-row{height:68px;display:grid;grid-template-columns:1fr 56px;align-items:center;gap:8px}
.icon-btn{border:0;background:transparent;color:#c87568;width:50px;height:50px;border-radius:50%;display:grid;place-items:center}
.hamburger{width:24px;height:18px;position:relative;border-top:3px solid currentColor;border-bottom:3px solid currentColor}
.hamburger:after{content:"";position:absolute;left:0;right:0;top:6px;border-top:3px solid currentColor}
.logo{position:relative;text-align:center;font-weight:500;font-size:30px;letter-spacing:.06em;line-height:1.1;white-space:nowrap}
.logo:after{content:"♥";position:absolute;color:var(--pink);font-size:18px;top:-13px;right:17%;transform:rotate(-12deg)}
.add-top{width:52px;height:52px;border:0;border-radius:50%;background:var(--pink);color:#fff;font-size:35px;font-weight:300;line-height:1;box-shadow:0 5px 12px rgba(245,139,139,.28)}
.search-row{display:flex;align-items:center;gap:10px;margin:0 0 10px}
.search-wrap{position:relative;flex:1}
.search{width:100%;height:52px;padding:0 16px 0 47px;border:1px solid var(--line);border-radius:28px;background:#fff;outline:none;color:var(--brown);font-size:16px;box-shadow:0 2px 10px rgba(91,61,44,.05)}
.search::placeholder{color:#9b8b82}
.search-icon{position:absolute;left:16px;top:13px;width:21px;height:21px;border:3px solid #9b8e87;border-radius:50%;pointer-events:none}
.search-icon:after{content:"";position:absolute;width:9px;border-top:3px solid #9b8e87;right:-7px;bottom:-4px;transform:rotate(45deg);border-radius:3px}
.filter-btn{width:50px;height:50px;border:1px solid var(--line);border-radius:50%;background:#fff;color:var(--brown);display:grid;place-items:center;box-shadow:0 2px 10px rgba(91,61,44,.05)}
.filter-lines{width:22px;height:18px;position:relative;border-top:3px solid currentColor}
.filter-lines:before,.filter-lines:after{content:"";position:absolute;right:0;border-top:3px solid currentColor;border-radius:2px}.no-image-label{font-size:8px!important;line-height:1;white-space:nowrap}
.view-switch{display:flex;gap:6px}
.view-btn{width:38px;min-width:38px}
.view-btn.active{background:var(--pink);border-color:var(--pink);font-weight:700}
.view-toggle{width:50px;height:50px;border:1px solid var(--line);border-radius:50%;background:#fff;color:#8b685a;display:grid;place-items:center;box-shadow:0 2px 10px rgba(91,61,44,.05);font-size:25px}
.compact-list{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.compact-list .recipe-card{display:block;padding:7px;border-radius:12px}
.compact-list .recipe-photo{width:100%;height:82px;min-width:0;margin-bottom:5px;border-radius:9px}
.compact-list .recipe-body{padding:10px 11px 11px}
.compact-list .recipe-body h2{font-size:17px;margin:0 25px 5px 0;line-height:1.25}
.compact-list .meta{font-size:12px;-webkit-line-clamp:2}
.compact-list .favorite{right:7px;top:8px;font-size:22px}
.compact-list .more{right:10px;bottom:10px;font-size:19px}
@media(max-width:560px){
  .compact-list{grid-template-columns:repeat(3,1fr);gap:5px}
  .compact-list .recipe-card{padding:5px}
  .compact-list .recipe-photo{height:72px}
.compact-list .recipe-photo{height:100px}.compact-list .recipe-body h2{font-size:16px}.compact-list{gap:8px}}

.filter-lines:before{top:6px;width:16px}.filter-lines:after{top:13px;width:9px}
.categories{display:flex;gap:10px;overflow-x:auto;padding:3px 0 6px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.categories::-webkit-scrollbar{display:none}
.cat{flex:0 0 auto;border:1px solid var(--line);background:rgba(255,255,255,.65);color:#6d4f3d;border-radius:24px;padding:9px 20px;font-size:16px;white-space:nowrap;box-shadow:0 1px 4px rgba(91,61,44,.03)}
.cat.active{background:var(--pink);border-color:var(--pink);color:#fff;font-weight:600}
main{padding:14px 16px 92px;max-width:760px;margin:auto}
.list-head{display:flex;align-items:center;justify-content:space-between;margin:2px 2px 12px}
.list-title{font-size:22px;font-weight:700}
.count{font-size:13px;color:var(--muted)}
.card{background:var(--paper);border:1px solid rgba(234,222,212,.75);border-radius:22px;box-shadow:var(--shadow)}
.recipe-card{display:flex;overflow:hidden;margin-bottom:12px;min-height:138px;cursor:pointer;transition:transform .12s ease}
.recipe-card:active{transform:scale(.99)}
.recipe-photo{width:14%;min-width:58px;background:linear-gradient(145deg,#f7e4d1,#fff1df);display:grid;place-items:center;font-size:66px;overflow:hidden;position:relative}
.recipe-photo:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.18));pointer-events:none}.recipe-photo img{width:100%;height:100%;object-fit:cover;display:block}
.recipe-body{flex:1;min-width:0;padding:18px 16px 15px 18px;position:relative}
.recipe-body h2{margin:0 38px 9px 0;font-size:23px;line-height:1.25;font-weight:600;color:var(--brown)}
.meta{font-size:14px;line-height:1.55;color:#705b4f;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.favorite{position:absolute;right:14px;top:16px;border:0;background:transparent;color:#ee7f82;font-size:29px;line-height:1;padding:2px}
.more{position:absolute;right:17px;bottom:15px;color:#aa9285;font-size:24px;letter-spacing:2px;line-height:.6}
.add-hint{color:var(--muted);text-align:center;padding:38px 15px;font-size:14px}
.form-card{padding:20px;margin-top:8px}
label{display:block;font-weight:600;margin:16px 0 7px}
.photo-field{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.photo-preview{width:120px;height:90px;border-radius:15px;overflow:hidden;background:#f7e4d1;border:1px solid var(--line);display:grid;place-items:center;color:#9b8578;font-size:13px}.photo-preview img{width:100%;height:100%;object-fit:cover}.photo-actions{display:flex;gap:8px}.photo-btn{border:1px solid var(--line);background:#fff;border-radius:13px;padding:10px 13px;color:#6d4f3d}.photo-btn.remove{display:none;color:#a35b5b}
input,textarea{width:100%;padding:13px 14px;border:1px solid var(--line);border-radius:15px;background:#fff;outline:none;color:var(--brown)}
textarea{min-height:110px;resize:vertical}
.category-select{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.category-option{padding:11px 8px;border:1px solid var(--line);border-radius:14px;background:#fff;color:#6d4f3d}.category-option.selected{background:var(--pink2);border-color:#efaaa3;font-weight:700}
.actions{display:flex;gap:10px;margin-top:20px}.save,.cancel,.delete{flex:1;padding:13px;border:0;border-radius:15px;font-weight:600}.save{background:var(--pink);color:#fff}.cancel{background:#eee5df;color:#66534a}.delete{background:#f3d9d9;color:#8a4b4b}
.back{border:0;background:transparent;color:#8b685a;padding:8px 2px 14px;font-size:15px}
.detail-card{padding:20px}
.detail-top{display:grid;grid-template-columns:44% 56%;gap:22px;align-items:start;margin-bottom:18px}
.detail-photo{width:100%;height:280px;border-radius:18px;overflow:hidden;background:#f7e4d1;display:flex;align-items:center;justify-content:center}
.detail-photo img{width:100%;height:100%;object-fit:contain;display:block}
.detail-info{min-width:0;padding:6px 4px 0}
.detail h2{font-size:28px;line-height:1.3;margin:0 0 8px}
.detail-category{font-size:14px;color:var(--muted);margin-bottom:14px}
.detail-memo{border-top:1px dashed #edcfc4;border-bottom:1px dashed #edcfc4;padding:14px 0;color:#665046;line-height:1.8}
.detail-memo-title{font-size:15px;font-weight:700;color:#d87873;margin-bottom:5px}
.detail section{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px;margin:12px 0;line-height:1.8}
.detail h3{font-size:17px;margin:0 0 9px;color:#d87873}
.detail-sections{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.detail-sections section{margin:0}
@media(max-width:560px){
  .compact-list{grid-template-columns:repeat(3,1fr);gap:5px}
  .compact-list .recipe-card{padding:5px}
  .compact-list .recipe-photo{height:72px}

  .detail-top{grid-template-columns:42% 58%;gap:14px}
  .detail-photo{height:210px}
  .detail h2{font-size:22px}
  .detail-info{padding-top:2px}
  .detail-sections{grid-template-columns:1fr}
  .detail-sections section{margin:0 0 12px}
}
.bottom-nav{position:fixed;left:10px;right:10px;bottom:10px;height:72px;z-index:20;background:rgba(255,253,249,.97);backdrop-filter:blur(15px);border:1px solid rgba(234,222,212,.9);border-radius:24px;box-shadow:0 8px 24px rgba(77,52,39,.12);display:grid;grid-template-columns:repeat(4,1fr);padding:5px 2px calc(5px + env(safe-area-inset-bottom))}
.nav-item{border:0;background:transparent;color:#927d70;font-size:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;border-radius:17px}.nav-item.active{color:#e9797d;background:#fff2ee;font-weight:700}.nav-icon{height:29px;display:grid;place-items:center;font-size:27px;line-height:1}.nav-icon.book:before{content:"▣"}.nav-icon.heart:before{content:"♡"}.nav-icon.cart:before{content:"🛒"}.nav-icon.gear:before{content:"⚙"}
.hidden{display:none!important}
@media(max-width:560px){
  .compact-list{grid-template-columns:repeat(3,1fr);gap:5px}
  .compact-list .recipe-card{padding:5px}
  .compact-list .recipe-photo{height:72px}
.logo{font-size:28px}.recipe-photo{width:14%;min-width:58px}.recipe-body h2{font-size:21px}.meta{font-size:13px}.bottom-nav{left:8px;right:8px}.cat{padding:9px 18px}}
</style>
</head>
<body>
<header>
  <div class="header-row">
    <div class="logo">マイレシピ帳</div>
    <button class="add-top" aria-label="新規" onclick="showForm()">＋</button>
  </div>
  <div class="search-row">
    <div class="search-wrap"><span class="search-icon"></span><input id="search" class="search" placeholder="料理名・材料で検索"></div>
    <div class="view-switch">
      <button id="listViewBtn" class="view-toggle view-btn" aria-label="リスト表示" onclick="setView('list')">☰</button>
      <button id="compactViewBtn" class="view-toggle view-btn" aria-label="たくさん表示" onclick="setView('compact')">▦</button>
    </div>
  </div>
  <div id="categories" class="categories"></div>
</header>

<main>
  <div id="listView">
    <div class="list-head"><div class="list-title">レシピ一覧</div><span id="count" class="count"></span></div>
    <div id="list"></div>
  </div>

  <div id="formView" class="hidden">
    <button class="back" onclick="showList()">← 一覧に戻る</button>
    <div class="card form-card">
      <h2 id="formTitle">料理を追加</h2>
      <label>料理名 *</label><input id="name" placeholder="例：肉じゃが">
      <label>料理の写真</label><div class="photo-field"><div id="photoPreview" class="photo-preview">写真なし</div><div class="photo-actions"><label class="photo-btn" style="margin:0;cursor:pointer">写真を選ぶ<input id="photo" type="file" accept="image/*" hidden></label><button type="button" id="removePhoto" class="photo-btn remove" onclick="removePhoto()">写真を削除</button></div></div>
      <label>カテゴリー</label><div id="categorySelect" class="category-select"></div>
      <label>材料</label><textarea id="ingredients" placeholder="じゃがいも 3個&#10;牛肉 200g&#10;玉ねぎ 1個"></textarea>
      <label>作り方</label><textarea id="steps" placeholder="1. 材料を切る&#10;2. 鍋で煮る…"></textarea>
      <label>メモ</label><textarea id="memo" placeholder="家族に好評、次回は少し薄味など"></textarea>
      <div class="actions"><button class="cancel" onclick="showList()">キャンセル</button><button class="save" onclick="saveRecipe()">保存する</button></div>
    </div>
  </div>

  <div id="detailView" class="hidden"><button class="back" onclick="showList()">← 一覧に戻る</button><div id="detail"></div></div>
</main>

<nav class="bottom-nav">
  <button class="nav-item active" data-tab="recipes"><span class="nav-icon book"></span><span>Home</span></button>
  <button class="nav-item" data-tab="favorites"><span class="nav-icon heart"></span><span>お気に入り</span></button>
  <button class="nav-item" data-tab="shopping"><span class="nav-icon cart"></span><span>買い物リスト</span></button>
  <button class="nav-item" data-tab="settings"><span class="nav-icon gear"></span><span>設定</span></button>
</nav>

<script>
const CATEGORIES=[
 {name:'牛肉',icon:'🥩'},{name:'豚肉',icon:'🐖'},{name:'鶏肉',icon:'🐓'},
 {name:'魚',icon:'🐟'},{name:'魚介類',icon:'🦐'},{name:'ご飯＆麺',icon:'🍚'},{name:'その他',icon:'🌷'}
];
let recipes=JSON.parse(localStorage.getItem('recipes')||'[]');
let editing=null,selectedCategory='すべて',currentPhoto='',returnToDetail=null;let compactView=localStorage.getItem('recipeView')==='compact';
const $=id=>document.getElementById(id);
function save(){localStorage.setItem('recipes',JSON.stringify(recipes))}
function categoryName(r){return r.category||'その他'}
function categoryIcon(name){return (CATEGORIES.find(x=>x.name===name)||{icon:'🌷'}).icon}
function renderCategories(){
 $('categories').innerHTML=`<button class="cat ${selectedCategory==='すべて'?'active':''}" data-category="すべて">すべて</button>`+CATEGORIES.map(c=>`<button class="cat ${selectedCategory===c.name?'active':''}" data-category="${c.name}">${c.name}</button>`).join('');
}
function filterCategory(name){selectedCategory=name;renderCategories();render()}
document.addEventListener('click',e=>{const b=e.target.closest('#categories .cat');if(b)filterCategory(b.dataset.category)})
function showList(){ $('listView').classList.remove('hidden');$('formView').classList.add('hidden');$('detailView').classList.add('hidden');renderCategories();updateViewButtons();render();setActive('recipes') }
function showForm(id=null){if(id!==null&&document.getElementById('detailView').classList.contains('hidden')===false)returnToDetail=id;else returnToDetail=null;editing=id;$('listView').classList.add('hidden');$('detailView').classList.add('hidden');$('formView').classList.remove('hidden');let r=id===null?null:recipes[id];$('formTitle').textContent=r?'料理を編集':'料理を追加';$('name').value=r?.name||'';$('ingredients').value=r?.ingredients||'';$('steps').value=r?.steps||'';$('memo').value=r?.memo||'';currentPhoto=r?.photo||'';renderCategorySelect(r?.category||'その他');renderPhotoPreview()}
function renderCategorySelect(selected='その他'){$('categorySelect').innerHTML=CATEGORIES.map(c=>`<button type="button" class="category-option ${selected===c.name?'selected':''}" onclick="chooseCategory('${c.name}')">${c.icon} ${c.name}</button>`).join('');$('categorySelect').dataset.value=selected}
function chooseCategory(name){renderCategorySelect(name)}
function renderPhotoPreview(){const p=$('photoPreview'),b=$('removePhoto');if(currentPhoto){p.innerHTML=`<img src="${currentPhoto}" alt="料理の写真">`;b.style.display='inline-block'}else{p.textContent='写真なし';b.style.display='none'}}
function removePhoto(){currentPhoto='';$('photo').value='';renderPhotoPreview()}
$('photo').addEventListener('change',e=>{const f=e.target.files?.[0];if(!f)return;const reader=new FileReader();reader.onload=()=>{currentPhoto=reader.result;renderPhotoPreview()};reader.readAsDataURL(f)})
function saveRecipe(){let name=$('name').value.trim();if(!name){alert('料理名を入れてください😊');return}let duplicate=recipes.some((r,i)=>i!==editing&&(r.name||'').trim()===name);if(duplicate){alert('「'+name+'」はもう登録されています。');return}let r={name,category:$('categorySelect').dataset.value||'その他',ingredients:$('ingredients').value,steps:$('steps').value,memo:$('memo').value,photo:currentPhoto};if(editing===null){recipes.unshift(r);save();showList();}else{let savedIndex=editing;recipes[savedIndex]=r;save();if(returnToDetail!==null){returnToDetail=null;showDetail(savedIndex);}else{showList();}}}
function recipeVisual(name,cat){return 'no image'}
function toggleFavorite(e,i){e.stopPropagation();recipes[i].favorite=!recipes[i].favorite;save();render()}
function setView(view){compactView=view==='compact';localStorage.setItem('recipeView',compactView?'compact':'list');updateViewButtons();render()}
function updateViewButtons(){const a=$('listViewBtn'),b=$('compactViewBtn');if(a)a.classList.toggle('active',!compactView);if(b)b.classList.toggle('active',compactView)}
function render(){let q=$('search').value.trim().toLowerCase();let a=recipes.map((r,i)=>({r,i})).filter(x=>selectedCategory==='すべて'||categoryName(x.r)===selectedCategory).filter(x=>((x.r.name||'')+' '+(x.r.ingredients||'')+' '+(x.r.memo||'')).toLowerCase().includes(q));$('count').textContent=a.length+'件';$('list').className=compactView?'compact-list':'';$('list').className=compactView?'compact-list':'';$('list').innerHTML=a.length?a.map(x=>{let cat=categoryName(x.r);return `<div class="card recipe-card" onclick="showDetail(${x.i})"><div class="recipe-photo">${x.r.photo?`<img src="${x.r.photo}" alt="">`:recipeVisual(x.r.name,cat)}</div><div class="recipe-body"><button class="favorite" onclick="toggleFavorite(event,${x.i})">${x.r.favorite?'♥':'♡'}</button><h2>${esc(x.r.name)}</h2>${x.r.memo?`<div class="meta">${esc(x.r.memo)}</div>`:''}<div class="more">⋮</div></div></div>`}).join(''):`<div class="card add-hint">まだ料理が登録されていません。<br>右上の「＋」から新規登録できます😊</div>`}
function showDetail(i){let r=recipes[i];$('listView').classList.add('hidden');$('formView').classList.add('hidden');$('detailView').classList.remove('hidden');let photo=r.photo?`<div class="detail-photo"><img src="${r.photo}" alt="料理の写真"></div>`:`<div class="detail-photo">${recipeVisual(r.name,categoryName(r))}</div>`;let memo=r.memo?`<div class="detail-memo"><div class="detail-memo-title">メモ</div><div>${nl(r.memo)}</div></div>`:'';$('detail').innerHTML=`<div class="card detail-card detail"><div class="detail-top">${photo}<div class="detail-info"><h2>${esc(r.name)}</h2><div class="detail-category">${categoryIcon(categoryName(r))} ${esc(categoryName(r))}</div>${memo}</div></div><div class="detail-sections">${r.ingredients?`<section><h3>🍲 材料</h3><div>${nl(r.ingredients)}</div></section>`:''}${r.steps?`<section><h3>🍳 作り方</h3><div>${nl(r.steps)}</div></section>`:''}</div><div class="actions"><button class="cancel" onclick="showList()">キャンセル</button><button class="save" onclick="showForm(${i})">編集する</button></div></div>`}
function removeRecipe(i){if(confirm('この料理を削除しますか？')){recipes.splice(i,1);save();showList()}}
function renderFavorites(){let a=recipes.map((r,i)=>({r,i})).filter(x=>x.r.favorite);$('count').textContent=a.length+'件';$('list').innerHTML=a.length?a.map(x=>{let cat=categoryName(x.r);return `<div class="card recipe-card" onclick="showDetail(${x.i})"><div class="recipe-photo">${x.r.photo?`<img src="${x.r.photo}" alt="">`:recipeVisual(x.r.name,cat)}</div><div class="recipe-body"><button class="favorite">♥</button><h2>${esc(x.r.name)}</h2>${x.r.memo?`<div class="meta">${esc(x.r.memo)}</div>`:''}<div class="more">⋮</div></div></div>`}).join(''):'<div class="card add-hint">お気に入りはまだありません♡<br>レシピの♡を押して追加できます。</div>'}
function showSimplePage(title,message){$('listView').classList.remove('hidden');$('formView').classList.add('hidden');$('detailView').classList.add('hidden');$('count').textContent='';$('list').innerHTML=`<div class="card add-hint"><h2>${title}</h2><p>${message}</p></div>`}
function setActive(tab){document.querySelectorAll('.nav-item').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab))}
function nl(s){return esc(s).replace(/\n/g,'<br>')}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
$('search').addEventListener('input',render)
document.querySelectorAll('.nav-item').forEach(btn=>btn.addEventListener('click',()=>{let tab=btn.dataset.tab;setActive(tab);if(tab==='recipes'){selectedCategory='すべて';$('search').value='';showList()}else if(tab==='favorites'){selectedCategory='すべて';$('search').value='';renderFavorites()}else if(tab==='shopping'){showSimplePage('買い物リスト','ここに買い物リストを追加できます。')}else if(tab==='settings'){showSimplePage('設定','「マイレシピ帳」の設定画面です。')}}));
renderCategories();updateViewButtons();render();
</script>
</body>
</html>
